<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Expense Tracker</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<h1>Expense tracker</h1>
	<form id="expense-form">
		<label for="amount">Choose expense amount:</label>
		<input id="amount" type="number" min="0.01" step="0.01" required>

		<label for="description">Choose description:</label>
		<input id="description" type="text" maxlength="255" required>

		<label for="category">Choose a category:</label>
		<select id="category" required>
			<option value="Fuel">Fuel</option>
			<option value="Food">Food</option>
			<option value="Electricity">Electricity</option>
			<option value="Movie">Movie</option>
			<option value="Games">Games</option>
		</select>

		<button id="submit-button" type="submit">Add Expense</button>
		<button id="cancel-edit" type="button" hidden>Cancel edit</button>
	</form>
	<p id="status" role="status" aria-live="polite"></p>
	<ul id="expense-list"></ul>

	<script src="index.js"></script>
</body>
</html>
